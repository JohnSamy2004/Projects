<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css">
    <title>Styled To-Do List</title>
</head>

<body>
    <main>
        <h1>My To-Do List<h1>
        <ul class="todo-list">
            <li>
                <input type="checkbox"  id="item1">
                <label for="item1">Explore gaming keyboards</label>
                <ul class="sub-item">
                    <li type="square"><a class="sub-item-link" href="#" target="_blank">Store Link</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox"  id="item2">
                <label for="item2">Finish the report</label>
                <ul class="sub-item">
                    <li type="square"><a class="sub-item-link" href="#" target="_blank">Request Access</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox"  id="item3">
                <label for="item3"> View Phone's Warranty</label>
                <ul class="sub-item">
                    <li type="square"><a class="sub-item-link" href="#" target="_blank">View Receipts</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox"  id="item4">
                <label for="item4">Check Processor Specs</label>
                <ul class="sub-item">
                    <li type="square"><a class="sub-item-link" href="#" target="_blank">View Model Number</a></li>
                </ul>
            </li>
        </ul>
    </main>
</body>

</html>
